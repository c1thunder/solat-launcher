plugins {
    id 'com.android.application'
}

// Release signing lives outside the repo. Point SOLAT_SIGNING at a keystore.properties file
// (storeFile, storePassword, keyAlias, keyPassword), or keep it in ../SolatLauncher-signing/ next to the repo.
def signingProps = new Properties()
def signingFile = file(System.getenv('SOLAT_SIGNING') ?: "${rootDir}/../SolatLauncher-signing/keystore.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'my.solat.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'my.solat.launcher'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        if (signingProps['storeFile']) {
            release {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingProps['storeFile']) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
